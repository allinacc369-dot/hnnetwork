<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sophos XGS Series | HN Network</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .product-card:hover {
      transform: translateY(-10px);
    }

    .pagination-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #3b82f6;
      border-radius: 10px;
    }
  </style>
</head>
<body class="bg-[#fafafa]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const App = () => {
      const [scrolled, setScrolled] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [currentPage, setCurrentPage] = useState(1);
      const productsPerPage = 9;

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 20);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const sophosProducts = [
        { id: 1, model: 'XGS 87', desc: 'Hardware Appliance with 4 GbE ports', throughput: '3.7 Gbps', threat: '240 Mbps', memory: '4 GB', vpn: '750 Mbps' },
        { id: 2, model: 'XGS 87w', desc: 'Hardware Appliance with 4 GbE ports + Wi-Fi', throughput: '3.7 Gbps', threat: '240 Mbps', memory: '4 GB', vpn: '750 Mbps' },
        { id: 3, model: 'XGS 107', desc: 'Hardware Appliance with 8 GbE + 1 SFP', throughput: '7.0 Gbps', threat: '330 Mbps', memory: '4 GB', vpn: '900 Mbps' },
        { id: 4, model: 'XGS 107w', desc: 'Hardware Appliance with 8 GbE + 1 SFP + Wi-Fi', throughput: '7.0 Gbps', threat: '330 Mbps', memory: '4 GB', vpn: '900 Mbps' },
        { id: 5, model: 'XGS 116', desc: 'Hardware Appliance with 8 GbE + 1 SFP + 1 GbE bypass', throughput: '7.7 Gbps', threat: '685 Mbps', memory: '4 GB', vpn: '1.1 Gbps' },
        { id: 6, model: 'XGS 116w', desc: 'Hardware Appliance with 8 GbE + 1 SFP + 1 GbE bypass + Wi-Fi', throughput: '7.7 Gbps', threat: '685 Mbps', memory: '4 GB', vpn: '1.1 Gbps' },
        { id: 7, model: 'XGS 126', desc: 'Hardware Appliance with 8 GbE + 1 SFP + 1 SFP+ + 1 GbE bypass', throughput: '10.5 Gbps', threat: '900 Mbps', memory: '4 GB', vpn: '1.8 Gbps' },
        { id: 8, model: 'XGS 126w', desc: 'Hardware Appliance with 8 GbE + 1 SFP + 1 SFP+ + 1 GbE bypass + Wi-Fi', throughput: '10.5 Gbps', threat: '900 Mbps', memory: '4 GB', vpn: '1.8 Gbps' },
        { id: 9, model: 'XGS 136', desc: 'Hardware Appliance with 8 GbE + 1 SFP + 1 SFP+ + 1 GbE bypass', throughput: '11.5 Gbps', threat: '1.0 Gbps', memory: '4 GB', vpn: '2.5 Gbps' },
        { id: 10, model: 'XGS 136w', desc: 'Hardware Appliance with 8 GbE + 1 SFP + 1 SFP+ + 1 GbE bypass + Wi-Fi', throughput: '11.5 Gbps', threat: '1.0 Gbps', memory: '4 GB', vpn: '2.5 Gbps' },

        { id: 13, model: 'XGS 3100', desc: 'Hardware Appliance with 8 GbE + 2 SFP + 1 SFP+ + 1 Flexi Port slot', throughput: '45.0 Gbps', threat: '2.0 Gbps', memory: '16 GB', vpn: '5.0 Gbps' },

      ];

      const currentProducts = useMemo(() => {
        const firstPageIndex = (currentPage - 1) * productsPerPage;
        const lastPageIndex = firstPageIndex + productsPerPage;
        return sophosProducts.slice(firstPageIndex, lastPageIndex);
      }, [currentPage]);

      const totalPages = Math.ceil(sophosProducts.length / productsPerPage);

      const handleZaloRedirect = (phone) => {
        const cleanPhone = phone.replace(/\./g, '');
        window.open(`https://zalo.me/${cleanPhone}`, '_blank');
      };

      return (

                <span className="font-extrabold text-xl tracking-tighter text-slate-900 hidden sm:inline uppercase">HN NETWORK</span>
              </a>
              
              <div className="hidden md:flex items-center gap-8 font-bold text-[11px] uppercase tracking-widest text-slate-500">
                <a href="index.html" className="hover:text-blue-600 transition-colors">Trang chủ</a>
                <a href="#" className="text-blue-600">Sản phẩm Sophos</a>
                <a href="#" className="hover:text-blue-600 transition-colors">Giải pháp</a>

              </div>

                  <span className="text-blue-600 font-bold text-sm">0938.888.304</span>
                </div>
                <button 
                  onClick={() => handleZaloRedirect('0938888304')}
                  className="bg-blue-600 text-white px-6 py-2.5 rounded-full text-xs font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 hover:shadow-blue-300 transition-all active:scale-95"
                >
                  BÁO GIÁ
                </button>
                <button className="md:hidden text-slate-900" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                  <i className={`fa-solid ${mobileMenuOpen ? 'fa-xmark' : 'fa-bars'} text-2xl`}></i>
                </button>
              </div>
            </div>
          </nav>

          {/* Mobile Menu */}
          {mobileMenuOpen && (
            <div className="fixed inset-0 z-40 bg-white pt-24 px-6 md:hidden animate-in fade-in slide-in-from-top-4 duration-300">
              <div className="flex flex-col gap-6 text-xl font-bold text-slate-800">
                <a href="index.html" onClick={() => setMobileMenuOpen(false)}>Trang chủ</a>
                <a href="#" onClick={() => setMobileMenuOpen(false)} className="text-blue-600">Sản phẩm Sophos</a>
                <a href="#" onClick={() => setMobileMenuOpen(false)}>Giải pháp</a>
                <a href="#" onClick={() => setMobileMenuOpen(false)}>Dịch vụ</a>
                <hr className="border-slate-100" />
                <div className="flex flex-col gap-2">
                  <span className="text-xs text-slate-400 uppercase tracking-widest">Liên hệ nhanh</span>
                  <p className="text-blue-600 text-2xl">0938.888.304</p>
                </div>
              </div>
            </div>
          )}

          <main className="pt-40 pb-24 flex-grow">
            <div className="container mx-auto px-6">
              <div className="flex flex-col items-center text-center mb-16">
                <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-blue-50 text-blue-600 text-[10px] font-black uppercase tracking-widest mb-6 border border-blue-100 shadow-sm">
                  <i className="fa-solid fa-shield-check mr-1"></i> Authorized Partner
                </div>
                <h1 className="text-4xl md:text-6xl font-black text-slate-900 mb-6 tracking-tight uppercase leading-tight">
                  Sophos Firewall <span className="text-blue-600">XGS Series</span>
                </h1>
                <p className="text-slate-500 max-w-2xl font-medium leading-relaxed text-lg">
                  Kiến trúc Xstream vượt trội, mang lại hiệu suất tối đa cho việc kiểm tra SSL và ngăn chặn mọi mối đe dọa mạng hiện đại.
                </p>
              </div>

              {/* Grid */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                {currentProducts.map((p) => (
                  <div key={p.id} className="product-card bg-white rounded-[2.5rem] border border-slate-100 shadow-xl shadow-slate-200/40 transition-all duration-500 group flex flex-col h-full overflow-hidden">
                    <div className="p-8 pb-4">
                      <div className="flex justify-between items-start mb-6">
                        <div className="w-14 h-14 bg-slate-50 rounded-2xl flex items-center justify-center text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-all duration-500 shadow-inner">
                          <i className="fa-solid fa-server text-2xl"></i>
                        </div>
                        <span className="text-[10px] font-black bg-blue-50 text-blue-600 px-3 py-1 rounded-full uppercase tracking-widest border border-blue-100">
                          Next-Gen FW
                        </span>
                      </div>
                      
                      <h3 className="text-2xl font-black text-slate-800 mb-2 group-hover:text-blue-600 transition-colors tracking-tight">
                        Sophos {p.model}
                      </h3>
                      <p className="text-slate-400 text-xs font-bold mb-8 line-clamp-1 uppercase tracking-wide">
                        {p.desc}
                      </p>
                      
                      <div className="space-y-4 mb-8">
                        <div className="flex items-center justify-between p-3 rounded-2xl bg-slate-50/50 hover:bg-white hover:shadow-md transition-all">
                          <div className="flex items-center gap-3 text-slate-500 font-bold text-xs uppercase tracking-tighter">
                            <i className="fa-solid fa-bolt text-amber-500"></i> Firewall
                          </div>
                          <span className="font-black text-slate-800 text-sm">{p.throughput}</span>
                        </div>
                        <div className="flex items-center justify-between p-3 rounded-2xl bg-slate-50/50 hover:bg-white hover:shadow-md transition-all">
                          <div className="flex items-center gap-3 text-slate-500 font-bold text-xs uppercase tracking-tighter">
                            <i className="fa-solid fa-shield-virus text-red-500"></i> Threat Prot.
                          </div>
                          <span className="font-black text-slate-800 text-sm">{p.threat}</span>
                        </div>
                        <div className="flex items-center justify-between p-3 rounded-2xl bg-slate-50/50 hover:bg-white hover:shadow-md transition-all">
                          <div className="flex items-center gap-3 text-slate-500 font-bold text-xs uppercase tracking-tighter">
                            <i className="fa-solid fa-network-wired text-green-500"></i> IPsec VPN
                          </div>
                          <span className="font-black text-slate-800 text-sm">{p.vpn}</span>
                        </div>
                      </div>
                    </div>

                    <div className="p-8 pt-0 mt-auto">
                      <button 
                        onClick={() => handleZaloRedirect('0938888304')}
                        className="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest flex items-center justify-center gap-3 group-hover:bg-blue-600 transition-all shadow-xl shadow-slate-200 group-hover:shadow-blue-200 active:scale-95"
                      >
                        Báo giá chi tiết <i className="fa-solid fa-chevron-right text-[10px]"></i>
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              {/* Pagination */}
              <div className="mt-20 flex flex-col md:flex-row justify-center items-center gap-6">
                <div className="flex items-center gap-3">
                  <button 
                    onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))}
                    disabled={currentPage === 1}
                    className="pagination-btn w-12 h-12 rounded-2xl border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-white hover:shadow-xl transition-all active:scale-90"
                  >
                    <i className="fa-solid fa-chevron-left"></i>
                  </button>
                  
                  <div className="flex gap-2">
                    {[...Array(totalPages)].map((_, i) => (
                      <button
                        key={i}
                        onClick={() => setCurrentPage(i + 1)}
                        className={`w-12 h-12 rounded-2xl font-black text-sm transition-all active:scale-90 ${
                          currentPage === i + 1 
                          ? 'bg-blue-600 text-white shadow-lg shadow-blue-200 scale-110' 
                          : 'bg-white border border-slate-200 text-slate-400 hover:border-blue-300 hover:text-blue-500'
                        }`}
                      >
                        {i + 1}
                      </button>
                    ))}
                  </div>

                  <button 
                    onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))}
                    disabled={currentPage === totalPages}
                    className="pagination-btn w-12 h-12 rounded-2xl border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-white hover:shadow-xl transition-all active:scale-90"
                  >
                    <i className="fa-solid fa-chevron-right"></i>
                  </button>
                </div>
                <span className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">
                  Trang {currentPage} / {totalPages}
                </span>
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="bg-slate-950 text-white pt-24 pb-12">
            <div className="container mx-auto px-6">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-16 mb-20">
                <div className="lg:col-span-4">
                  <div className="flex items-center gap-3 mb-10">
                    <div className="w-8 h-8 bg-blue-600 rounded flex items-center justify-center font-bold text-sm text-white">HN</div>
                    <span className="font-extrabold text-lg tracking-tight uppercase">HN NETWORK</span>
                  </div>
                  <div className="grid gap-4">
                    <div onClick={() => handleZaloRedirect('0938.888.304')} className="bg-white/5 border border-white/10 p-5 rounded-3xl hover:bg-white/10 cursor-pointer group transition-all">
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-slate-500 text-[10px] font-black uppercase tracking-widest">Kinh doanh 1</span>
                        <i className="fa-solid fa-phone text-blue-400 group-hover:rotate-12 transition-transform"></i>
                      </div>
                      <p className="text-xl font-black tracking-tight group-hover:text-blue-400 transition-colors">0938.888.304</p>
                    </div>
                    <div onClick={() => handleZaloRedirect('0974.700.952')} className="bg-white/5 border border-white/10 p-5 rounded-3xl hover:bg-white/10 cursor-pointer group transition-all">
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-slate-500 text-[10px] font-black uppercase tracking-widest">Kinh doanh 2</span>
                        <i className="fa-solid fa-phone text-blue-400 group-hover:rotate-12 transition-transform"></i>
                      </div>
                      <p className="text-xl font-black tracking-tight group-hover:text-blue-400 transition-colors">0974.700.952</p>
                    </div>
                  </div>
                </div>
                
                <div className="lg:col-span-5">
                  <h4 className="text-blue-400 text-[10px] font-black uppercase tracking-[0.3em] mb-10">Thông tin liên hệ</h4>
                  <div className="space-y-8">
                    <div className="flex gap-5 group">
                      <div className="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center text-blue-400 shrink-0 shadow-inner group-hover:bg-blue-600 group-hover:text-white transition-all">
                        <i className="fa-solid fa-location-dot text-xl"></i>
                      </div>
                      <div>
                        <h5 className="text-[10px] font-black mb-2 uppercase tracking-widest text-slate-400">Văn phòng chính</h5>
                        <p className="text-slate-200 text-sm leading-relaxed font-semibold italic">Số 2A Đường Thành Công, P. Phú Thọ Hòa, Q. Tân Phú, TP. HCM</p>
                      </div>
                    </div>
                    <div className="flex gap-5 group">
                      <div className="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center text-blue-400 shrink-0 shadow-inner group-hover:bg-blue-600 group-hover:text-white transition-all">
                        <i className="fa-solid fa-headset text-xl"></i>
                      </div>
                      <div>
                        <h5 className="text-[10px] font-black mb-2 uppercase tracking-widest text-slate-400">Kỹ thuật & Hỗ trợ</h5>
                        <p className="text-slate-200 text-sm font-semibold italic">CSKH: (028) 668 42 689 | info@hnnetwork.vn</p>
                      </div>
                    </div>
                    <div className="flex gap-4 pt-4">
                      <a href="#" className="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center hover:bg-[#1877F2] transition-all border border-white/5 active:scale-90"><i className="fa-brands fa-facebook-f"></i></a>
                      <a href="#" className="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center hover:bg-[#FF0000] transition-all border border-white/5 active:scale-90"><i className="fa-brands fa-youtube"></i></a>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-3">
                  <h4 className="text-blue-400 text-[10px] font-black uppercase tracking-[0.3em] mb-10">Bản đồ</h4>
                  <div className="rounded-[2.5rem] overflow-hidden grayscale hover:grayscale-0 transition-all duration-1000 border border-white/10 h-[220px] shadow-2xl relative">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.2412216077746!2d106.63263728527505!3d10.792827961914577!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x317529532c42131f%3A0xc72609f9f908c1cc!2zMkEgVGjDoG5oIEPDtG5nLCBUw6JuIFRow6BuaCwgVMOibiBQaMO6LCBUaMOgbmggcGjhu5EgSOG7kyBDaMOtIE1pbmgsIFZp4buHdCBOYW0!5e0!3m2!1svi!2s!4v1772251814694!5m2!1svi!2s" width="100%" height="100%" frameBorder="0" style={{ border:0 }} allowFullScreen loading="lazy"></iframe>
                  </div>
                </div>
              </div>
              
              <div className="pt-12 border-t border-white/5 text-center text-[10px] text-slate-500 font-black uppercase tracking-[0.3em]">
                <p>&copy; 2026 HN Network Enterprise. All Rights Reserved.</p>
              </div>
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
